name: Cross-platform Build

on:
  push:
    branches:
      - '*develop*'
      - '*master*'
  pull_request:
    branches:
      - '*develop*'
      - '*master*'

jobs:
  cross_build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      # 1. Checkout коду
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Встановлення CMake (за потреби)
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.27.0'

      # 3. Windows
      - name: Run build script (Windows)
        if: runner.os == 'Windows'
        run: cmd /c ci.bat
        shell: cmd

      # 4. Unix (Ubuntu, macOS)
      - name: Run build script (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x ci.sh
          ./ci.sh
        shell: bash

      # 5. Deploy (приклад)
      - name: Deploy
        if: success()
        run: echo "Deploy completed for ${{ matrix.os }}"
